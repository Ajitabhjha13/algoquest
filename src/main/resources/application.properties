spring.application.name=algoquest-api
server.port=8080

# Password wali file yahan se padho (local computer pe).
# Render pe yahi values "Environment Variables" se aayengi.
spring.config.import=optional:file:./secrets.properties

# Database kahan hai (values secrets.properties se aati hain)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Java class dekh ke table apne aap banao / update karo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false